<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbf9" />
    <script>
      /* Apply the saved theme before first paint (no flash). Default: light. */
      (function () {
        var t = 'light'
        try { t = localStorage.getItem('woxsen:theme') === 'dark' ? 'dark' : 'light' } catch (e) {}
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0c0c0d')
      })()
    </script>
    <meta name="description" content="Woxsen Car Rentals. Chauffeur-grade cars reserved by the day across Mumbai, Bengaluru and Pune." />
    <title>Woxsen Car Rentals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600;700&family=Pinyon+Script&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Woxsen Car Rentals needs JavaScript enabled to load reservations.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
